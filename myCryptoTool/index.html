<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES加密解密工具</title>
    <script src="./crypto-js.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            opacity: 0.8;
            font-size: 1.1em;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-group button {
            flex: 1;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
        }
        .message-list {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            background: white;
        }
        .message-item {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .message-title {
            font-weight: 600;
            color: #2c3e50;
        }
        .message-content {
            color: #6c757d;
            font-size: 14px;
        }
        .message-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .message-actions button {
            padding: 5px 10px;
            font-size: 12px;
        }
        .result-area {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: block;
            padding: 12px;
            background: #e9ecef;
            border: 2px dashed #6c757d;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-label:hover {
            background: #dee2e6;
            border-color: #667eea;
        }
        .config-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 500;
            position: fixed;
            left: 50%;
            transform: translate(-50%, 10%); /* 向左和向上移动自身宽度的50% */
            background-color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            border-radius: 4px;
            z-index: 1000; /* 确保弹窗在页面上层 */
            display: none;
            text-align: center;
            max-width: 200px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .ecryptInfo-box{
            margin-top: 30px;
        }
        .ecryptInfo-ontent{
            width: 100%;
            word-break: break-all;
            height: 300px;
            overflow: auto;
        }
    </style>
</head>
<body>

       <div id="messageBox" class="alert"></div>

    <div class="container">
        <div class="main-content">
            <!-- 加密区域 -->
            <div class="section">
                <h2>🔒 AES加密配置</h2>
                
                <div class="config-group">
                    <div class="form-group">
                        <label for="mode">加密模式</label>
                        <select id="mode">
                            <option value="CBC">CBC</option>
                            <option value="CFB">CFB</option>
                            <option value="OFB">OFB</option>
                            <option value="CTR">CTR</option>
                            <option value="ECB">ECB</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="padding">填充方式</label>
                        <select id="padding">
                            <option value="Pkcs7">Pkcs7</option>
                            <option value="Iso97971">Iso97971</option>
                            <option value="AnsiX923">AnsiX923</option>
                            <option value="Iso10126">Iso10126</option>
                            <option value="ZeroPadding">ZeroPadding</option>
                            <option value="NoPadding">NoPadding</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">密码（用于生成密钥）</label>
                    <input type="password" id="password" placeholder="输入密码自动生成密钥">
                    <button onclick="generateKey()" class="btn-secondary">生成密钥</button>
                </div>

                <div class="form-group">
                    <label for="key">密钥（直接输入）</label>
                    <input type="text" id="key" placeholder="或直接输入AES密钥">
                </div>

                <h2>📝 消息管理</h2>
                
                <div class="form-group">
                    <label for="messageTitle">标题</label>
                    <input type="text" id="messageTitle" placeholder="输入消息标题">
                </div>

                <div class="form-group">
                    <label for="messageContent">内容</label>
                    <textarea id="messageContent" rows="3" placeholder="输入消息内容"></textarea>
                </div>

                <button onclick="addMessage()" class="btn-success">添加消息</button>

                <div class="message-list" id="messageList">
                    <div class="empty-state">
                        <div>📋</div>
                        <p>暂无消息，请添加消息</p>
                    </div>
                </div>

                <button onclick="encryptAll()" class="btn-success">加密所有消息</button>

                <div class="form-group ecryptInfo-box">
                    <label for="ecryptInfo">（用于保存）的加密信息</label>
                  <div class="ecryptInfo-ontent" id="ecryptInfo"></div>
                    <button onclick="copyEcryptInfo()" class="btn-secondary">复制（用于保存）的加密信息</button>

                </div>
            </div>

            <!-- 解密区域 -->
            <div class="section">
                <h2>🔓 AES解密配置</h2>
                
                <div class="config-group">
                    <div class="form-group">
                        <label for="decryptMode">加密模式</label>
                        <select id="decryptMode">
                            <option value="CBC">CBC</option>
                            <option value="CFB">CFB</option>
                            <option value="OFB">OFB</option>
                            <option value="CTR">CTR</option>
                            <option value="ECB">ECB</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="decryptPadding">填充方式</label>
                        <select id="decryptPadding">
                            <option value="Pkcs7">Pkcs7</option>
                            <option value="Iso97971">Iso97971</option>
                            <option value="AnsiX923">AnsiX923</option>
                            <option value="Iso10126">Iso10126</option>
                            <option value="ZeroPadding">ZeroPadding</option>
                            <option value="NoPadding">NoPadding</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="decryptKey">解密密钥</label>
                    <input type="text" id="decryptKey" placeholder="输入解密密钥">
                </div>
                 <div class="form-group">
                    <label for="ciphertext">密文输入</label>
                    <textarea id="ciphertext" rows="4" placeholder="粘贴密文（base64）内容"></textarea>
                </div>
            
                  <div class="form-group">
                    <label for="ciphertextIv">IV输入</label>
                       <input type="text" id="ciphertextIv" placeholder="若密文不包含iv,请输入（base64）Iv">
                </div>

                <div class="form-group">
                    <label class="file-label" for="fileInput">
                        密文导入(点击选择或拖拽文件到此处)
                    </label>
                    <input type="file" id="fileInput" class="file-input" accept=".txt">
                </div>
        
                <button onclick="decryptText()" class="btn-success">解密文本</button>

                <h2>📄 解密结果</h2>
                <div class="result-area" id="decryptResult">
                    <div class="empty-state">
                        <div>🔍</div>
                        <p>解密结果将显示在这里</p>
                    </div>
                </div>

                <div class="btn-group">
                    <button onclick="copyResult()" class="btn-secondary">复制结果</button>
                    <button onclick="downloadResult()" class="btn-success">下载结果</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 存储消息列表
        let messages = [];
        let currentEncryptedResult = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 文件上传处理
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', handleFileUpload);
            
            // 拖拽文件处理
            const fileLabel = document.querySelector('.file-label');
            fileLabel.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileLabel.style.background = '#dee2e6';
                fileLabel.style.borderColor = '#667eea';
            });
            
            fileLabel.addEventListener('dragleave', () => {
                fileLabel.style.background = '#e9ecef';
                fileLabel.style.borderColor = '#6c757d';
            });
            
            fileLabel.addEventListener('drop', (e) => {
                e.preventDefault();
                fileLabel.style.background = '#e9ecef';
                fileLabel.style.borderColor = '#6c757d';
                
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileUpload({ target: fileInput });
                }
            });
        });


        // 生成密钥
        function generateKey() {
            const password = document.getElementById('password').value;
            if (!password) {
                showMessage('请输入密码', 'danger');
                return;
            }
            
            // 使用PBKDF2生成密钥
            // const salt = CryptoJS.lib.WordArray.random(128/8);
            const salt="52$87gdfkjg@"
            const key = CryptoJS.PBKDF2(password, salt, {
                keySize: 128/32,
                iterations: 10000
            });
            
            document.getElementById('key').value = key.toString();
            document.getElementById('decryptKey').value = key.toString();
            showMessage('密钥已生成并填充', 'success');
        }

        // 添加消息
        function addMessage() {
            const title = document.getElementById('messageTitle').value;
            const content = document.getElementById('messageContent').value;
            
            if (!title || !content) {
                showMessage('请填写标题和内容', 'danger');
                return;
            }
            
            messages.push({ title, content });
            renderMessages();
            
            // 清空输入框
            document.getElementById('messageTitle').value = '';
            document.getElementById('messageContent').value = '';
            
            showMessage('消息已添加', 'success');
        }

        // 渲染消息列表
        function renderMessages() {
            const messageList = document.getElementById('messageList');
            
            if (messages.length === 0) {
                messageList.innerHTML = `
                    <div class="empty-state">
                        <div>📋</div>
                        <p>暂无消息，请添加消息</p>
                    </div>
                `;
                return;
            }
            
            messageList.innerHTML = messages.map((message, index) => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-title">${escapeHtml(message.title)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(message.content)}</div>
                    <div class="message-actions">
                        <button onclick="editMessage(${index})" class="btn-secondary">编辑</button>
                        <button onclick="deleteMessage(${index})" class="btn-danger">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 编辑消息
        function editMessage(index) {
            const message = messages[index];
            document.getElementById('messageTitle').value = message.title;
            document.getElementById('messageContent').value = message.content;
            deleteMessage(index);
        }

        // 删除消息
        function deleteMessage(index) {
            messages.splice(index, 1);
            renderMessages();
            showMessage('消息已删除', 'success');
        }

        // 加密所有消息
        function encryptAll() {
            if (messages.length === 0) {
                showMessage('请先添加消息', 'danger');
                return;
            }
            
            const key = document.getElementById('key').value;
            if (!key) {
                showMessage('请先生成或输入密钥', 'danger');
                return;
            }
            
            const mode = document.getElementById('mode').value;
            const padding = document.getElementById('padding').value;
            const key32 = CryptoJS.enc.Utf8.parse(key); // 32字节
            const ecryptInfo=document.getElementById('ecryptInfo')
            try {
                    // 生成随机 IV（16字节）
                   const iv = CryptoJS.lib.WordArray.random(16);
                   const encrypted = CryptoJS.AES.encrypt(
                        JSON.stringify(messages),
                        key32,
                        {   iv: iv,
                            mode: CryptoJS.mode[mode],
                            padding: CryptoJS.pad[padding]
                        }
                    );
                    // 将 IV 和密文组合：IV + 密文
                    const ivBase64 = CryptoJS.enc.Base64.stringify(iv);
                    const encryptedBase64=encrypted.toString();

                    const cipherAlltextBase64 =ivBase64 + encryptedBase64;

                    const rawData = iv.concat(encrypted.ciphertext);
                    const combined = CryptoJS.enc.Base64.stringify(rawData);
                    const info={
                        ivBase64:ivBase64,
                        okey:key,
                        utf8Key:key32.toString(),
                        iVCombinedRawBase64:combined,
                        ciphertextBase64:encryptedBase64,
                        iVciphertextBase64:cipherAlltextBase64,
                        mode:mode
                    }
                    // 32字节密钥 = AES-256
                        console.table(info);
                   
                        let infoStr=`
                        默认加密模式：AES-256，填充：${padding}</br></br>
                        密钥：【${key}】</br></br>
                        初始化向量(iv)+密文二进制拼接(Base64)：【${combined}】</br></br>
                        初始化向量(iv)(Base64)：【${ivBase64}】</br></br>
                        纯(Base64)密文：【${encryptedBase64}】</br></br>
                

                        【AES加密模式对应关系说明】：</br>
                        密钥长度 对应AES模式   密钥字节数	密钥位数</br>
                        16字节	 AES-128	  16 bytes	  128 bits</br>
                        24字节	 AES-192	  24 bytes	  192 bits</br>
                        32字节	 AES-256	  32 bytes    256 bits</br>

                        【本工具密钥生成方式说明】：</br>
                        工具密钥生成：库为【CryptoJS.PBKDF2】，盐：【52$87gdfkjg@】，迭代次数：10000，密钥长度32字符</br>
                        过程：【 const salt="52$87gdfkjg@"
                        const key = CryptoJS.PBKDF2(password, salt, {
                            keySize: 128/32,
                            iterations: 10000
                        });】
                        salt为自定义盐52$87gdfkjg@，iterations迭代次数，通过相同的盐、迭代次数可生生成相同的密钥。</br></br>

                        【加、解密】：
                        原始密钥需经过经过CryptoJS.enc.Utf8.parse(key) UTF8解码</br></br>
                          初始化向量(iv)+密文二进制拼接(Base64)使用方式： $data = base64_decode($encryptedData)进行Base64解码，提取二进制内容， substr($data, 0, 16) 前16字节为iv,剩余部分为密文。
                        `
                    ecryptInfo.innerHTML=infoStr
                // 显示在解密区域的密文框中
                document.getElementById('ciphertext').value = encryptedBase64
                document.getElementById('decryptMode').value = mode;
                document.getElementById('decryptPadding').value = padding;
                document.getElementById('decryptKey').value = key;
                document.getElementById('ciphertextIv').value=ivBase64;
                showMessage('加密成功！密文已复制到解密区域', 'success');
            } catch (error) {
                showMessage('加密失败: ' + error.message, 'danger');
            }
        }

        // 解密文本
       function decryptText() {
        // 设置加密回填
         const encryptKey = document.getElementById('key');
        const encryptMode = document.getElementById('mode');
        const encryptPadding = document.getElementById('padding');

            const ciphertextBase64 = document.getElementById('ciphertext').value;
            const key = document.getElementById('decryptKey').value;
            const mode = document.getElementById('decryptMode').value;
            const padding = document.getElementById('decryptPadding').value;
            const ivBase64 = document.getElementById('ciphertextIv').value;
             const resultArea = document.getElementById('decryptResult');
            if (!ciphertextBase64 || !key) {
                showMessage('请提供密文和密钥', 'danger');
                return;
            }

            try {
                // 解析密文
                const ciphertextData = CryptoJS.enc.Base64.parse(ciphertextBase64);
                const key32 = CryptoJS.enc.Utf8.parse(key);
                
                const options = {
                    mode: CryptoJS.mode[mode],
                    padding: CryptoJS.pad[padding]
                };

                let iv;
                let actualCiphertext;

                // 情况1：用户明确提供了IV
                if (ivBase64 && ivBase64.trim() !== '') {
                    iv = CryptoJS.enc.Base64.parse(ivBase64);
                    actualCiphertext = ciphertextData; // 使用完整的密文
                } 
                // 情况2：自动从密文前面截取IV（假设前16字节是IV）
                else if (ciphertextData.sigBytes >= 16) {
                    // 前16字节作为IV
                    iv = CryptoJS.lib.WordArray.create(ciphertextData.words.slice(0, 4));
                    // 剩余部分作为实际密文
                    actualCiphertext = CryptoJS.lib.WordArray.create(ciphertextData.words.slice(4));
                    actualCiphertext.sigBytes = ciphertextData.sigBytes - 16;
                    
                    console.log('自动提取IV: 长度', iv.sigBytes, '字节');
                }
                // 情况3：无法获取IV
                else {
                    showMessage('无法获取IV，请提供IV或使用包含IV的密文', 'danger');
                    return;
                }

                // 设置IV到选项
                if (iv) {
                    options.iv = iv;
                    console.log('使用IV: 长度', iv.sigBytes, '字节');
                }

                // 执行解密
                const bytes = CryptoJS.AES.decrypt(
                    { ciphertext: actualCiphertext },
                    key32,
                    options
                );
                
                const jsonStr = bytes.toString(CryptoJS.enc.Utf8);
                if (jsonStr) {
                    const decryptedData = JSON.parse(jsonStr);
                    // 显示解密结果...
                        resultArea.innerHTML = decryptedData.map(item => `
                            <div class="message-item">
                                <div class="message-header">
                                    <span class="message-title">${escapeHtml(item.title)}</span>
                                </div>
                                <div class="message-content">${escapeHtml(item.content)}</div>
                            </div>
                        `).join('');

                        // 回填解密消息
                       messages=[]
                        decryptedData.forEach(item => {
                            messages.push({ title:item.title, content:item.content });
                        });
                        renderMessages()
                        encryptKey.value=key
                    showMessage('解密成功！', 'success');
                } else {
                    showMessage('解密失败，请检查密钥和IV', 'danger');
                }
                
            } catch (error) {
                showMessage('解密失败: ' + error.message, 'danger');
                resultArea.innerHTML =''
            }
        }

        // 文件上传处理
        function handleFileUpload(event) {
            const file = event.target.files[0];

            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileValue=e.target.result
                const ciphertextEl=document.getElementById('ciphertext')
                const ciphertextIv=document.getElementById('ciphertextIv')
                if(fileValue){
                    const arr=fileValue.split('\n').filter(item=>isNeStr(item))
                    if(arr.length===1){
                        ciphertextEl.value = e.target.result;
                         ciphertextIv.value=''
                    }else if(arr.length>=2){
                       ciphertextIv.value = arr[0];
                        ciphertextEl.value = arr[1];
                    }
                    showMessage('文件已加载', 'success');
                }else{
                    showMessage('文件加载失败', 'danger');
                }

                document.getElementById('fileInput').value=null;

         
            };
            reader.readAsText(file);
        }
        function isNeStr(value){
            return  (typeof value === 'string' || value instanceof String) && value !== '';
        }

        // 复制结果
        function copyResult() {
            const result = document.getElementById('decryptResult').textContent;
            navigator.clipboard.writeText(result).then(() => {
                showMessage('结果已复制到剪贴板', 'success');
            });
        }

        // 复制（用于保存）的加密信息
        function copyEcryptInfo(){
            const result = document.getElementById('ecryptInfo').textContent;
            navigator.clipboard.writeText(result).then(() => {
                showMessage('（用于保存）的加密信息已复制到剪贴板', 'success');
            });
        }

        // 下载结果
        function downloadResult() {
            const result = document.getElementById('decryptResult').textContent;
            const blob = new Blob([result], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'decrypted_result.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 显示提示信息
        function showMessage(message, type) {
            // 移除现有的提示
            const messageBox = document.getElementById('messageBox');
            if(!messageBox){
                return;
            }
            messageBox.className = `alert alert-${type}`;
            messageBox.textContent = message;
            messageBox.style.display = 'block'; // 显示消息框
      
            
            // 3秒后自动消失
            setTimeout(() => {
              messageBox.style.display = 'none'; // 显示消息框
            }, 3000);
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
